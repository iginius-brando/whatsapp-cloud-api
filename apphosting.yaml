# Configurazione Firebase App Hosting.
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # --- Firebase client config (PUBBLICA) --------------------------------
  # Serve sia in fase di build che a runtime. Sostituisci i value con quelli
  # del tuo progetto (Firebase Console > Impostazioni progetto > Le tue app).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBIAEQntyCuqWpSgoWLKzNiS6uiofLusM8
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: whatsapp-cloud-9560a.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: whatsapp-cloud-9560a
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: whatsapp-cloud-9560a.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "1083758399746"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:1083758399746:web:8f7f49ff63fd0127a1b21b
    availability: [BUILD, RUNTIME]

  - variable: WHATSAPP_GRAPH_API_VERSION
    value: v22.0
    availability: [RUNTIME]

  # --- Segreti WhatsApp (Cloud Secret Manager) --------------------------
  # Crea i segreti con:
  #   firebase apphosting:secrets:set whatsapp-access-token
  #   firebase apphosting:secrets:set whatsapp-phone-number-id
  #   firebase apphosting:secrets:set whatsapp-webhook-verify-token
  #   firebase apphosting:secrets:set whatsapp-app-secret
  - variable: WHATSAPP_ACCESS_TOKEN
    secret: whatsapp-access-token
    availability: [RUNTIME]
  - variable: WHATSAPP_PHONE_NUMBER_ID
    secret: whatsapp-phone-number-id
    availability: [RUNTIME]
  - variable: WHATSAPP_WEBHOOK_VERIFY_TOKEN
    secret: whatsapp-webhook-verify-token
    availability: [RUNTIME]
  - variable: WHATSAPP_APP_SECRET
    secret: whatsapp-app-secret
    availability: [RUNTIME]

  # --- WhatsApp Flows ---------------------------------------------------
  # ID del Flow: non è un segreto, ma cambia tra bozza e versione pubblicata.
  # Togli il commento e inserisci l'ID; App Hosting rifiuta un `value` vuoto,
  # quindi la variabile va lasciata assente finché non si ha l'ID vero.
  # - variable: WHATSAPP_FLOW_ID
  #   value: "1234567890123456"
  #   availability: [RUNTIME]

  # Metti "true" finché il Flow è in bozza (invio consentito ai soli numeri di test).
  - variable: WHATSAPP_FLOW_DRAFT_MODE
    value: "false"
    availability: [RUNTIME]
  # Chiave privata RSA del Flow Endpoint e relativa passphrase. Crea i segreti con:
  #   firebase apphosting:secrets:set whatsapp-flow-private-key
  #   firebase apphosting:secrets:set whatsapp-flow-private-key-passphrase
  - variable: WHATSAPP_FLOW_PRIVATE_KEY
    secret: whatsapp-flow-private-key
    availability: [RUNTIME]
  - variable: WHATSAPP_FLOW_PRIVATE_KEY_PASSPHRASE
    secret: whatsapp-flow-private-key-passphrase
    availability: [RUNTIME]
