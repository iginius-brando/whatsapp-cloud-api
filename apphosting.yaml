# Configurazione Firebase App Hosting.
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # --- Firebase client config (PUBBLICA) --------------------------------
  # Serve sia in fase di build che a runtime. Sostituisci i value con quelli
  # del tuo progetto (Firebase Console > Impostazioni progetto > Le tue app).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBIAEQntyCuqWpSgoWLKzNiS6uiofLusM8
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: whatsapp-cloud-9560a.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: whatsapp-cloud-9560a
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: whatsapp-cloud-9560a.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "1083758399746"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:1083758399746:web:8f7f49ff63fd0127a1b21b
    availability: [BUILD, RUNTIME]

  - variable: WHATSAPP_GRAPH_API_VERSION
    value: v22.0
    availability: [RUNTIME]

  # --- Manutenzione periodica (Cloud Scheduler) -------------------------
  # Token con cui Cloud Scheduler chiama POST /api/whatsapp/maintenance:
  # rielabora gli eventi del webhook rimasti in coda e archivia su Storage gli
  # allegati non ancora copiati. Senza questo secret l'endpoint risponde 503 e
  # la manutenzione non parte. Crea il segreto con:
  #   firebase apphosting:secrets:set whatsapp-maintenance-token
  - variable: WHATSAPP_MAINTENANCE_TOKEN
    secret: whatsapp-maintenance-token
    availability: [RUNTIME]

  # --- Segreti WhatsApp (Cloud Secret Manager) --------------------------
  # Crea i segreti con:
  #   firebase apphosting:secrets:set whatsapp-access-token
  #   firebase apphosting:secrets:set whatsapp-phone-number-id
  #   firebase apphosting:secrets:set WHATSAPP_BUSINESS_ACCOUNT_ID
  #   firebase apphosting:secrets:set whatsapp-webhook-verify-token
  #   firebase apphosting:secrets:set whatsapp-app-secret
  - variable: WHATSAPP_ACCESS_TOKEN
    secret: whatsapp-access-token
    availability: [RUNTIME]
  - variable: WHATSAPP_PHONE_NUMBER_ID
    secret: whatsapp-phone-number-id
    availability: [RUNTIME]
  # Nota: questo secret in Secret Manager si chiama WHATSAPP_BUSINESS_ACCOUNT_ID
  # (maiuscolo con underscore), non whatsapp-business-account-id.
  - variable: WHATSAPP_BUSINESS_ACCOUNT_ID
    secret: WHATSAPP_BUSINESS_ACCOUNT_ID
    availability: [RUNTIME]
  - variable: WHATSAPP_WEBHOOK_VERIFY_TOKEN
    secret: whatsapp-webhook-verify-token
    availability: [RUNTIME]
  - variable: WHATSAPP_APP_SECRET
    secret: whatsapp-app-secret
    availability: [RUNTIME]

  # --- Embedded Signup (onboarding clienti) -----------------------------
  # Le variabili NEXT_PUBLIC_* finiscono nel bundle del browser, quindi
  # servono anche in fase di BUILD. App Hosting rifiuta un `value` vuoto:
  # togli il commento solo quando hai l'ID vero, non lasciare "".
  # - variable: NEXT_PUBLIC_META_APP_ID
  #   value: "<app-id-meta>"
  #   availability: [BUILD, RUNTIME]
  # - variable: NEXT_PUBLIC_META_EMBEDDED_SIGNUP_CONFIG_ID
  #   value: "<configuration-id>"
  #   availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_META_GRAPH_API_VERSION
    value: v22.0
    availability: [BUILD, RUNTIME]
  # "3" per le configurazioni attuali, "none" per le configurazioni v4
  # (extras vuoto: ogni scelta sta nella configurazione di login).
  - variable: NEXT_PUBLIC_META_EMBEDDED_SIGNUP_SESSION_INFO_VERSION
    value: "3"
    availability: [BUILD, RUNTIME]

  # App secret per lo scambio del code: se non lo imposti viene riusato
  # WHATSAPP_APP_SECRET, che di norma è lo stesso valore.
  # - variable: META_APP_SECRET
  #   secret: meta-app-secret
  #   availability: [RUNTIME]

  # Passphrase per cifrare a riposo i token dei clienti su Firestore. Crea il
  # secret prima di togliere il commento, altrimenti il rollout fallisce in
  # `preparer` con fah/misconfigured-secret:
  #   firebase apphosting:secrets:set whatsapp-tenant-token-secret
  # - variable: WHATSAPP_TENANT_TOKEN_SECRET
  #   secret: whatsapp-tenant-token-secret
  #   availability: [RUNTIME]

  # --- WhatsApp Flows ---------------------------------------------------
  # ID del Flow "Flusso Prenotazione". Non è un segreto.
  # Nota: App Hosting rifiuta un `value` vuoto, quindi se un giorno si toglie
  # l'ID va commentata l'intera voce, non lasciata con le virgolette vuote.
  - variable: WHATSAPP_FLOW_ID
    value: "1550967203432683"
    availability: [RUNTIME]

  # "true" finché il Flow è in bozza: l'invio funziona solo verso i numeri di
  # test dell'app. Da rimettere a "false" dopo la pubblicazione del Flow.
  - variable: WHATSAPP_FLOW_DRAFT_MODE
    value: "true"
    availability: [RUNTIME]
  # Chiave privata RSA del Flow Endpoint e relativa passphrase. Crea i segreti con:
  #   firebase apphosting:secrets:set whatsapp-flow-private-key
  #   firebase apphosting:secrets:set whatsapp-flow-private-key-passphrase
  - variable: WHATSAPP_FLOW_PRIVATE_KEY
    secret: whatsapp-flow-private-key
    availability: [RUNTIME]
  - variable: WHATSAPP_FLOW_PRIVATE_KEY_PASSPHRASE
    secret: whatsapp-flow-private-key-passphrase
    availability: [RUNTIME]
